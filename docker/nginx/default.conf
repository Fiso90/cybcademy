# CybCademy — Nginx configuration
#
# Reverse-proxies to the PHP-FPM app container (docker-compose service
# name "app"). Cloudflare terminates the public-facing SSL (Phase 4
# Section 11) and forwards to this container over the private Docker
# network, so this config does not itself handle TLS termination.
#
# Security headers here directly implement Phase 7 Section 9.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # --- Security headers (Phase 7 Section 9) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP is deliberately restrictive by default; script-src additions for
    # any third-party origin (Bootstrap Icons CDN, Alpine.js CDN, per
    # Phase 11's layouts/app.blade.php) are explicit allow-list entries,
    # not a wildcard - each addition here should be a reviewed decision.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; frame-ancestors 'none';" always;

    client_max_body_size 12M; # slightly above the 10MB policy-upload limit (Phase 7 Section 14) to allow for multipart overhead

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 310; # slightly above GenerateAuditExportPackage's 300s job timeout (Epic E7), so Nginx never times out a request the job itself would still consider valid
    }

    # Deny access to dotfiles and the Laravel .env/storage internals -
    # defence in depth beyond the app not serving these paths itself.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/(storage|bootstrap/cache) {
        deny all;
    }
}
