; Production Opcache configuration.
; validate_timestamps=0 is the deliberate choice referenced in the
; Dockerfile's comment - correct for immutable container deployments
; where code changes always arrive via a new image, never in-place edits.

opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=1255
opcache.jit_buffer_size=64M
